    }

    .summary {
      margin: 24px 0;
      padding: 22px;
      background: #FFFFFF;
      border: 1px solid #E4EAE2;

      color: #5D6B60;

      font-size: 14px;
    }

    @media (max-width: 600px) {
      main {

      }
